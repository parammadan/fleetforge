[workspace]
resolver = "3"
members = [
    "crates/ff-core",
    "crates/ff-collect",
    "crates/ff-preflight",
    "crates/ff-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/parammadan/fleetforge"
authors = ["Param Madan"]

[workspace.dependencies]
ff-core = { path = "crates/ff-core", version = "0.1.0" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
proptest = "1"

# Kubernetes. Only ff-collect may depend on these (ADR-0008); the boundary
# tests in ff-core fail the build otherwise.
#
# k8s-openapi 0.28 targets at most v1_36 while the local cluster runs v1.37.0.
# That is a supported +1 client skew, and FleetForge reports it rather than
# assuming it is harmless — see ADR-0022.
kube = { version = "4", default-features = false, features = ["client", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["v1_36"] }
# kube pulls rustls but leaves the crypto provider ambiguous; pick one explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
async-stream = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
ff-collect = { path = "crates/ff-collect", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# No panics in normal paths. Tests opt out locally.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
# Honesty: floating point has no place in a model whose hash must be
# byte-identical across architectures.
float_arithmetic = "deny"

[profile.dev]
# Disk is the binding constraint on the development machine (36 GB free).
debug = 1

[profile.release]
lto = "thin"
strip = true
