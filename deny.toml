# Dependency policy. See ADR-0010: a copyleft dependency would force the
# licence decision to be revisited, so the build fails rather than quietly
# accepting one.

[advisories]
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-root-certs ships Mozilla's CA bundle under the Community Data
    # License Agreement - Permissive 2.0. It licenses the certificate *data*,
    # not code: no copyleft, no attribution requirement on downstream works,
    # and redistribution is explicitly permitted. Compatible with shipping an
    # Apache-2.0 binary (ADR-0010).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
