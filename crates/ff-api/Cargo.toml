[package]
name = "ff-api"
description = "Axum HTTP surface and the fleetforge binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "ff_api"
path = "src/lib.rs"

# The binary is `fleetforge`, not `ff-api`. The crate is an implementation
# detail; the command is the product.
[[bin]]
name = "fleetforge"
path = "src/main.rs"

[dependencies]
ff-core.workspace = true
ff-collect.workspace = true
ff-preflight.workspace = true
ff-record.workspace = true
ff-replay.workspace = true
axum.workspace = true
async-stream.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true

[lints]
workspace = true
