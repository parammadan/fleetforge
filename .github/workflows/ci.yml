name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The history scan above covers tracked content. This covers the working
      # tree, which is where a real credential would actually land — the live
      # kubeconfigs are gitignored, and this proves that is still true.
      - name: verify gitignored credentials stay untracked
        run: |
          for f in infra/local/.kubeconfig-x infra/eks/.kubeconfig-x                    terraform.tfvars x.tfplan x.tfstate kubeconfig .env; do
            git check-ignore -q "$f" || { echo "NOT IGNORED: $f"; exit 1; }
          done
          echo "all credential paths ignored"

  rust:
    # Both architectures, because snapshot identity is a content hash that must
    # agree across them. The property tests in ff-core are the actual check.
    name: fmt / clippy / test (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  iac:
    # Terraform and Helm are as capable of a security mistake as Rust is, and
    # unlike Rust the mistake is live in an AWS account rather than a test.
    name: infrastructure static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
      - name: terraform fmt
        run: terraform fmt -check -recursive infra/
      - name: terraform validate
        run: |
          for dir in infra/terraform infra/terraform/guardrails; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: helm lint
        run: helm lint deploy/helm/fleetforge
      - name: install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: trivy config
        # One target at a time: trivy takes a single scan reference, and
        # --tf-exclude-downloaded-modules keeps vendored module source and its
        # examples out of the results.
        run: |
          for target in infra/terraform infra/terraform/guardrails deploy/helm/fleetforge; do
            echo "scanning $target"
            trivy config "$target" \
              --severity HIGH,CRITICAL \
              --tf-exclude-downloaded-modules \
              --skip-dirs '**/.terraform' \
              --ignorefile .trivyignore.yaml \
              --exit-code 1
          done

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  e2e:
    # A real browser against a real backend in fixture mode. These are the only
    # tests that assert what a person actually sees, so they are worth the
    # extra couple of minutes.
    name: end-to-end (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo build --bin fleetforge
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
